name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 PyYAML pytest
          python -m pytest -q

      - name: Build zip and SHA-256 checksum
        run: python tools/build_release.py --tag "${GITHUB_REF_NAME}" --out dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "dist/LocalTrainer-${VERSION}.zip" \
            "dist/LocalTrainer-${VERSION}.zip.sha256" \
            --title "LocalTrainer ${VERSION}" \
            --generate-notes \
            --verify-tag
